description = "Generic AI emoji generation marker"


# ═══ IDENTITY PATTERNS ══════════════════════════════════════════════════════
#  When a commit's AUTHOR or COMMITTER renders to a "Name <email>" string that
#  matches one of these, luddite rewrites that identity to the replacement
#  identity (default: the repo's git config user.name/user.email, override with
#  --replace-identity "Name <email>"). This catches agents that commit AS
#  themselves (Devin, Copilot bot) rather than as a co-author trailer.

[[identities]]
name = "anthropic-noreply"
regex = 'noreply@anthropic\.com'
description = "Claude / Anthropic bot identity"

[[identities]]
name = "openai-noreply"
regex = 'noreply@openai\.com|^Codex <'
description = "OpenAI Codex bot identity"

[[identities]]
name = "codex-connector-bot"
regex = 'chatgpt-codex-connector'
description = "ChatGPT Codex Connector GitHub App identity"

[[identities]]
name = "devin-bot"
regex = 'bot@devin\.ai|^Devin <'
description = "Devin bot identity"

[[identities]]
name = "copilot-bot"
regex = 'github-copilot\[bot\]|copilot@github\.com|Copilot@users\.noreply\.github\.com'
description = "GitHub Copilot bot identity"

[[identities]]
name = "cursor-agent"
regex = 'Cursor Agent|cursoragent|@cursor\.com'
description = "Cursor agent identity"

[[identities]]
name = "aider-bot"
regex = '^aider <|aider@aider\.chat'
description = "Aider bot identity"

[[identities]]
name = "codeium-bot"
regex = '@codeium\.com|@windsurf\.'
description = "Codeium / Windsurf bot identity"


# ═══ NOTES-REF DELETION ═════════════════════════════════════════════════════
#  Some attribution systems (e.g. git-ai) store AI provenance in git notes,
#  specifically engineered to survive history rewrites. Any ref whose full name
#  matches one of these is DELETED outright.

[[delete_notes]]
name = "git-ai-notes"
regex = '^refs/notes/ai($|/)'
description = "git-ai AI-attribution notes"

[[delete_notes]]
name = "generic-ai-notes"
regex = '^refs/notes/.*\bai\b'
description = "Any notes ref with an 'ai' component"
