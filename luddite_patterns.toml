# --- OpenAI Codex / ChatGPT ---
#  Verified against the Codex CLI 0.152.0 binary (2026-09): it appends
#  "Co-authored-by: Codex <noreply@openai.com>" to every commit it writes and
#  can footer with "Generated with [Codex](https://openai.com/codex/)." /
#  "Generated with Codex." / "Generated by Codex". Model names (gpt-5.x,
#  gpt-5.x-codex, codex-mini, o3/o4) never appear in the trailer — the name is
#  always "Codex". Codex cloud PRs arrive through the chatgpt-codex-connector
#  GitHub App. Only the noreply address is matched: a human OpenAI employee
#  co-authoring with a real @openai.com address is preserved.

[[patterns]]
name = "codex-coauthor"
regex = '(?m)^Co-[Aa]uthored-[Bb]y: .*\bCodex\b[^\n]*\r?\n?'
description = "OpenAI Codex co-author trailer (Codex CLI, Codex cloud, GPT-x-Codex)"

[[patterns]]
name = "openai-noreply-coauthor"
regex = '(?m)^Co-[Aa]uthored-[Bb]y: [^\n]*<[^\n]*noreply@openai\.com>[^\n]*\r?\n?'
description = "Any co-author trailer using the OpenAI noreply address"

[[patterns]]
name = "chatgpt-coauthor"
regex = '(?m)^Co-[Aa]uthored-[Bb]y: (ChatGPT|chatgpt|OpenAI|GPT-?[0-9])[^\n]*\r?\n?'
description = "ChatGPT / OpenAI / GPT-model co-author trailer"

[[patterns]]
name = "codex-connector-coauthor"
regex = '(?m)^Co-[Aa]uthored-[Bb]y: [^\n]*chatgpt-codex-connector[^\n]*\r?\n?'
description = "ChatGPT Codex Connector GitHub App co-author trailer"

[[patterns]]
name = "codex-footer"
regex = '(?m)^Generated (with|by) \[?Codex\]?[^\n]*\r?\n?'
description = "Codex footer: 'Generated with [Codex](https://openai.com/codex/).' / 'Generated by Codex'"

