# ─────────────────────────────────────────────────────────────────────────────
#  luddite — built-in indicator patterns
# ─────────────────────────────────────────────────────────────────────────────
#
#  This file is COMPILED INTO the binary as the default rule set. You do not edit
#  it to extend luddite at runtime — instead drop your own file at one of:
#
#      <repo>/.luddite.toml                  (per-repo overrides, highest priority)
#      ~/.config/luddite/patterns.toml       (personal global rules)
#      --patterns <file.toml>                 (explicit, loaded last)
#
#  Rules from every source are MERGED with these built-ins. Adding a new indicator
#  is a copy-paste of one block. There are three kinds:
#
#    [[patterns]]     Remove matching LINES from a commit message.
#    [[identities]]   Rewrite a commit's AUTHOR/COMMITTER when name/email matches.
#    [[delete_notes]] Delete an entire git-notes ref (AI attribution stores).
#
#  All regexes use Rust `regex` crate syntax. `(?m)` = multiline (^/$ per line).
# ─────────────────────────────────────────────────────────────────────────────


# ═══ MESSAGE-LINE PATTERNS ══════════════════════════════════════════════════
#  Each match is deleted from the commit message. Blank lines left behind are
#  collapsed automatically. Anchor with (?m)^ and consume the trailing newline
#  with \r?\n? so the whole line disappears cleanly.

# --- Anthropic / Claude ---
#  ONE rule covers every model name Claude Code has ever put in the trailer —
#  verified against real histories (2026-09): Claude, Claude Sonnet 4.6,
#  Claude Opus 4.5 / 4.6 / 4.7 / 4.8 (with and without "(1M context)"),
#  Claude Opus 5, Claude Fable 5, Claude Fable 5.1, Claude Haiku 4.5,
#  Claude Mythos 5.1. The model name is free text after "Claude" — never add
#  per-model rules. Newer surfaces: the `Claude-Session:` trailer (Claude Code
#  2026-08+) and the bare session URL that PR bodies carry into squash merges.

[[patterns]]
name = "claude-coauthor"
regex = '(?m)^Co-[Aa]uthored-[Bb]y: Claude[^\n]*\r?\n?'
description = "Claude AI co-author trailer (any model: Sonnet/Opus/Haiku/Fable/Mythos, any version)"

[[patterns]]
name = "claude-session-trailer"
regex = '(?m)^Claude-Session: [^\n]*\r?\n?'
description = "Claude Code session trailer (Claude-Session: https://claude.ai/code/session_…)"

[[patterns]]
name = "claude-session-url"
regex = '(?m)^[ \t]*https://claude\.ai/code/session_[^\n]*\r?\n?'
description = "Bare Claude Code session URL line (PR-body footer inherited by squash merges)"

[[patterns]]
name = "claude-code-footer-emoji"
regex = '(?m)^🤖 Generated with \[Claude Code\][^\n]*\r?\n?'
description = "Claude Code emoji footer (links to claude.ai/code or claude.com/claude-code)"

[[patterns]]
name = "claude-code-footer-plain"
regex = '(?m)^Generated with \[Claude Code\][^\n]*\r?\n?'
description = "Claude Code footer (no emoji)"

[[patterns]]
name = "claude-generic-trailer"
regex = '(?m)^(Coding-Agent|AI-assistant|AI-Assistant): .*[Cc]laude[^\n]*\r?\n?'
description = "Proposed Coding-Agent/AI-assistant trailer naming Claude"

